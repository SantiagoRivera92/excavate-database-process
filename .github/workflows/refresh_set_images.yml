name: Refresh Set Images

on:
  workflow_dispatch:
    inputs:
      set_code:
        description: 'Set code to refresh (e.g. RA04 or RA04-EN)'
        required: true
        type: string
      dry_run:
        description: 'Only list images without uploading'
        required: false
        default: false
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: Excavate

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Refresh set images
      env:
        SET_CODE: ${{ inputs.set_code }}
        DRY_RUN: ${{ inputs.dry_run }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        S3_API_URL: ${{ secrets.S3_API_URL }}
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        PYTHONUNBUFFERED: 1
      run: |
        if [ "$DRY_RUN" = "true" ]; then
          python src/refresh_set_images.py --set-code "$SET_CODE" --dry-run
        else
          python src/refresh_set_images.py --set-code "$SET_CODE"
        fi
